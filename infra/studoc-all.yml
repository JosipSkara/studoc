AWSTemplateFormatVersion: "2010-09-09"
Description: StuDoc Base Stack (Frontend + Backend + Cognito Auth)

Parameters:
  EcsExecutionRoleArn:
    Type: String
    Description: ARN of the ECS Task Execution Role (must be created beforehand).
  EcsTaskRoleArn:
    Type: String
    Description: ARN of the ECS Task Role (if needed for AWS interaction).

  VpcId:
    Type: AWS::EC2::VPC::Id

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id

  DatabaseImageUri:
    Type: String
    Default: postgres:15-alpine
    Description: PostgreSQL Docker image URI.

  CognitoDomainPrefix:
    Type: String
    Default: studocauthdemo
    Description: Globally unique prefix for Cognito hosted domain.

Resources:

  ##############################################
  # SECURITY GROUPS
  ##############################################

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic from the Internet to the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB and internal ECS communication
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  InternalEcsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ServiceSecurityGroup
      IpProtocol: -1
      SourceSecurityGroupId: !Ref ServiceSecurityGroup

  ##############################################
  # LOAD BALANCER + TARGET GROUPS
  ##############################################

  StuDocAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: studoc-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  FrontendTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: studoc-frontend-tg
      Protocol: HTTP
      Port: 80
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /

  BackendTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: studoc-backend-tg
      Protocol: HTTP
      Port: 3000
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: /health

  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref StuDocAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTG

  ApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HTTPListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values: ["/api/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTG

  ##############################################
  # ECS CLUSTER
  ##############################################

  StuDocCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: studoc-cluster

  ##############################################
  # TASK DEFINITIONS
  ##############################################

  DatabaseTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: studoc-db-task
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref EcsExecutionRoleArn
      TaskRoleArn: !Ref EcsTaskRoleArn
      ContainerDefinitions:
        - Name: studoc-db
          Image: !Ref DatabaseImageUri
          PortMappings:
            - ContainerPort: 5432
          Environment:
            - Name: POSTGRES_DB
              Value: studoc
            - Name: POSTGRES_USER
              Value: studoc
            - Name: POSTGRES_PASSWORD
              Value: password

  FrontendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: studoc-frontend-task
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref EcsExecutionRoleArn
      TaskRoleArn: !Ref EcsTaskRoleArn
      ContainerDefinitions:
        - Name: studoc-frontend
          Image: 992382686388.dkr.ecr.us-east-1.amazonaws.com/studoc-frontend:latest
          PortMappings:
            - ContainerPort: 80
          Environment:
            - Name: VITE_API_BASE_URL
              Value: !Sub "http://${StuDocAlb.DNSName}"

  BackendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: studoc-backend-task
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref EcsExecutionRoleArn
      TaskRoleArn: !Ref EcsTaskRoleArn
      ContainerDefinitions:
        - Name: studoc-backend
          Image: 992382686388.dkr.ecr.us-east-1.amazonaws.com/studoc-backend:latest
          PortMappings:
            - ContainerPort: 3000
          Environment:
            - Name: COGNITO_USER_POOL_ID
              Value: !Ref CognitoUserPool
            - Name: COGNITO_CLIENT_ID
              Value: !Ref CognitoUserPoolClient
            - Name: COGNITO_DOMAIN
              Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
            - Name: PORT
              Value: "3000"

  ##############################################
  # ECS SERVICES
  ##############################################

  DatabaseService:
    Type: AWS::ECS::Service
    DependsOn: [DatabaseTaskDef, InternalEcsIngress]
    Properties:
      Cluster: !Ref StuDocCluster
      ServiceName: studoc-db-service
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref DatabaseTaskDef
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ServiceSecurityGroup

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: HTTPListener
    Properties:
      Cluster: !Ref StuDocCluster
      ServiceName: studoc-frontend-service
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref FrontendTaskDef
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: studoc-frontend
          ContainerPort: 80
          TargetGroupArn: !Ref FrontendTG

  BackendService:
    Type: AWS::ECS::Service
    DependsOn: ApiRule
    Properties:
      Cluster: !Ref StuDocCluster
      ServiceName: studoc-backend-service
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref BackendTaskDef
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: studoc-backend
          ContainerPort: 3000
          TargetGroupArn: !Ref BackendTG

  ##############################################
  # COGNITO RESOURCES
  ##############################################

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: studoc-userpool
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          Required: true
          Mutable: false

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: studoc-app-client
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - http://localhost:3000/callback
      LogoutURLs:
        - http://localhost:3000/logout
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [email, openid, profile]
      AllowedOAuthFlowsUserPoolClient: true

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref CognitoUserPool

Outputs:
  LoadBalancerDNS:
    Description: Public ALB DNS
    Value: !GetAtt StuDocAlb.DNSName

  CognitoHostedUI:
    Description: Hosted UI URL for Cognito Login
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${CognitoUserPoolClient}&response_type=code&scope=email+openid+profile&redirect_uri=http://localhost:3000/callback"
