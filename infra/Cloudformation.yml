service: studoc-groups-api

frameworkVersion: 3

# ----------------------------------------------------
# ⚙️ Globale Konfiguration
# ----------------------------------------------------
custom:
  userPoolId: us-east-1_djyDpSa8G
  userPoolClientId: your-cognito-app-client-id # 👈 trage hier deine tatsächliche App Client ID aus Cognito ein

provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: us-east-1

  # IAM-Rolle, um CreateRole-Fehler zu vermeiden
  role: arn:aws:iam::992382686388:role/LabRole

  # ------------------------------------------------
  # 🔑 HTTP API + Cognito JWT Authorizer
  # ------------------------------------------------
  httpApi:
    authorizers:
      StuDocCognitoAuthorizer:
        type: jwt
        identitySource: "$request.header.Authorization"
        issuerUrl: https://cognito-idp.${self:provider.region}.amazonaws.com/${self:custom.userPoolId}
        audience:
          - ${self:custom.userPoolClientId}

# ----------------------------------------------------
# 💻 Funktionen (Endpoints)
# ----------------------------------------------------
functions:
  listGroups:
    handler: handler.listGroups
    events:
      - httpApi:
          path: /groups
          method: get
          authorizer: StuDocCognitoAuthorizer

  createGroup:
    handler: handler.createGroup
    events:
      - httpApi:
          path: /groups
          method: post
          authorizer: StuDocCognitoAuthorizer

  deleteGroup:
    handler: handler.deleteGroup
    events:
      - httpApi:
          path: /groups/{groupName}
          method: delete
          authorizer: StuDocCognitoAuthorizer

  listAllUsers:
    handler: handler.listAllUsers
    events:
      - httpApi:
          path: /users
          method: get
          authorizer: StuDocCognitoAuthorizer

  listGroupMembers:
    handler: handler.listGroupMembers
    events:
      - httpApi:
          path: /groups/{groupName}/members
          method: get
          authorizer: StuDocCognitoAuthorizer

  addUserToGroup:
    handler: handler.addUserToGroup
    events:
      - httpApi:
          path: /groups/{groupName}/members
          method: post
          authorizer: StuDocCognitoAuthorizer

  removeUserFromGroup:
    handler: handler.removeUserFromGroup
    events:
      - httpApi:
          path: /groups/{groupName}/members/{username}
          method: delete
          authorizer: StuDocCognitoAuthorizer
