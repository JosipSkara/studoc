AWSTemplateFormatVersion: "2010-09-09"
Description: StuDoc Backend Stack (Robust mit V2 DocumentClient und CORS-Handling)

Parameters:
  ProjectName:
    Type: String
    Default: StuDoc

  ApiStageName:
    Type: String
    Default: prod

Resources:

  # 1. DynamoDB Tabelle
  ModulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-Modules"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: moduleId
          AttributeType: S
      KeySchema:
        - AttributeName: moduleId
          KeyType: HASH

  # 2. IAM Rolle für Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-LambdaRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccessAndLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Berechtigung für DynamoDB Scan/Get
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                Resource: !GetAtt ModulesTable.Arn
              # Berechtigung für CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-GetModules:*"


  # 3. Lambda Funktion (mit V2 DocumentClient für Unmarshalling)
  GetModulesLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-GetModules"
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref ModulesTable
      # ✅ KORRIGIERTER CODE: Verwendet V2 DocumentClient, der automatisch unmarshalled
      Code:
        ZipFile: |
          const AWS = require("aws-sdk");
          // DocumentClient erledigt das Unmarshalling ({"S": "X"} -> "X") automatisch
          const dynamo = new AWS.DynamoDB.DocumentClient(); 
          
          const TABLE_NAME = process.env.TABLE_NAME;

          const corsHeaders = {
              "Access-Control-Allow-Origin": "*",
              "Content-Type": "application/json",
          };

          exports.handler = async (event) => {
            try {
              const data = await dynamo.scan({ TableName: TABLE_NAME }).promise();
          
              return {
                statusCode: 200,
                headers: corsHeaders,
                body: JSON.stringify(data.Items || []),
              };
            } catch (err) {
              console.error("❌ Lambda failed:", err);
              // Sendet CORS-Header auch im Fehlerfall (wichtig für den Browser)
              return {
                statusCode: 500,
                headers: corsHeaders, 
                body: JSON.stringify({ error: "Internal Server Error", detail: err.message }),
              };
            }
          };

  # 4. API Gateway
  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-API"

  ApiGatewayResourceModules:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: "modules"
      RestApiId: !Ref ApiGateway

  # 5. GET Methode (Proxy)
  ApiGatewayMethodGetModules:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiGatewayResourceModules
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetModulesLambda.Arn}/invocations"
      MethodResponses:
        - StatusCode: 200

  # 6. OPTIONS Methode (CORS Mock Handler)
  ApiGatewayOptionsModules:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiGatewayResourceModules
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST'"
            ResponseTemplates:
              application/json: "{}"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true

  # 7. Deployment und Stage
  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId: !Ref ApiGateway
      Description: Auto deployment
    DependsOn:
      - ApiGatewayMethodGetModules
      - ApiGatewayOptionsModules

  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: !Ref ApiStageName
      RestApiId: !Ref ApiGateway
      DeploymentId: !Ref ApiGatewayDeployment
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: true

  # 8. Lambda Berechtigung
  LambdaPermissionForApi:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetModulesLambda
      Action: lambda:InvokeFunction